<div class="catalog">
  <div class="container">
    <div class="catalog-title">
      Блог
    </div>
    <div class="catalog-head">
      <div class="catalog-applied-filters">

      </div>
      <div class="catalog-sorting" [class.open]="sortingOpen"   (click)="toggleSorting()">
        <div class="catalog-sorting-head">
          <span>Фильтр</span>
          <svg width="20" height="21" viewBox="0 0 20 21" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M10.0003 14.5C9.41693 14.5 8.83359 14.275 8.39193 13.8334L2.95859 8.40003C2.71693 8.15837 2.71693 7.75837 2.95859 7.5167C3.20026 7.27503 3.60026 7.27503 3.84193 7.5167L9.27526 12.95C9.67526 13.35 10.3253 13.35 10.7253 12.95L16.1586 7.5167C16.4003 7.27503 16.8003 7.27503 17.0419 7.5167C17.2836 7.75837 17.2836 8.15837 17.0419 8.40003L11.6086 13.8334C11.1669 14.275 10.5836 14.5 10.0003 14.5Z"
              fill="#2C2C2C"/>
          </svg>
        </div>
        <div class="catalog-sorting-body">
<!--          <div class="catalog-sorting-item" [class.active]="this.activeParams.sort ? this.activeParams.sort === sortingOption.value : false" *ngFor="let sortingOption of sortingOptions" (click)="sort(sortingOption.value)">{{sortingOption.name}}</div>-->
        </div>
      </div>
    </div>

    <div class="catalog-layout">
      <div class="catalog-products">
        <app-article *ngFor="let article of articles?.items" [article]="article"></app-article>
      </div>
    </div>


    <div class="pagination" *ngIf="pages.length > 1">
      <div class="pagination-arrow prev" >
<!--        [class.disabled]="activeParams.page ? activeParams.page === 1 : true" (click)="openPrevPage()"-->
        <svg viewBox="-19.04 0 75.804 75.804" xmlns="http://www.w3.org/2000/svg" transform="matrix(-1, 0, 0, 1, 0, 0)"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="Group_65" data-name="Group 65" transform="translate(-831.568 -384.448)"> <path id="Path_57" data-name="Path 57" d="M833.068,460.252a1.5,1.5,0,0,1-1.061-2.561l33.557-33.56a2.53,2.53,0,0,0,0-3.564l-33.557-33.558a1.5,1.5,0,0,1,2.122-2.121l33.556,33.558a5.53,5.53,0,0,1,0,7.807l-33.557,33.56A1.5,1.5,0,0,1,833.068,460.252Z"></path> </g> </g></svg>
      </div>
      <div class="pagination-pages">
        <a class="pagination-page"  *ngFor="let page of pages">{{page}}</a>
<!--        (click)="openPage(page)" [class.active]="this.activeParams.page ? this.activeParams.page === page : (page === 1)"-->
      </div>
      <div class="pagination-arrow next" >
<!--        [class.disabled]="activeParams.page ? activeParams.page === pages.length : false" (click)="openNextPage()"-->
        <svg viewBox="-19.04 0 75.804 75.804" xmlns="http://www.w3.org/2000/svg" ><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="Group_65" data-name="Group 65" transform="translate(-831.568 -384.448)"> <path id="Path_57" data-name="Path 57" d="M833.068,460.252a1.5,1.5,0,0,1-1.061-2.561l33.557-33.56a2.53,2.53,0,0,0,0-3.564l-33.557-33.558a1.5,1.5,0,0,1,2.122-2.121l33.556,33.558a5.53,5.53,0,0,1,0,7.807l-33.557,33.56A1.5,1.5,0,0,1,833.068,460.252Z"></path> </g> </g></svg>
      </div>
    </div>
  </div>
</div>
