<div class="catalog">
  <div class="container">
    <div class="catalog-title">
      Блог
    </div>
    <div class="catalog-head">
      <div class="catalog-applied-filters">
        <div class="catalog-applied-filter" *ngFor="let appliedFilter of appliedFilters">
          <span>{{appliedFilter.name}}</span>
          <svg width="16" height="17" viewBox="0 0 16 17" fill="none" xmlns="http://www.w3.org/2000/svg" (click)="removeFilter(appliedFilter)">
            <g clip-path="url(#clip0_19511_586)">
              <line x1="1.93553" y1="3.15002" x2="13.9563" y2="15.1708" stroke="#709FDC" stroke-linecap="round"/>
              <line x1="13.9236" y1="3.12984" x2="1.90278" y2="15.1507" stroke="#709FDC" stroke-linecap="round"/>
            </g>
            <defs>
              <clipPath id="clip0_19511_586">
                <rect width="16" height="16" fill="white" transform="translate(0 0.5)"/>
              </clipPath>
            </defs>
          </svg>
        </div>
      </div>
      <div class="catalog-sorting" [class.open]="sortingOpen" >
        <div class="catalog-sorting-head" (click)="toggleSorting()">
          <span>Фильтр</span>
          <svg *ngIf="!sortingOpen" width="20" height="21" viewBox="0 0 20 21" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path
              d="M10.0003 14.5C9.41693 14.5 8.83359 14.275 8.39193 13.8334L2.95859 8.40003C2.71693 8.15837 2.71693 7.75837 2.95859 7.5167C3.20026 7.27503 3.60026 7.27503 3.84193 7.5167L9.27526 12.95C9.67526 13.35 10.3253 13.35 10.7253 12.95L16.1586 7.5167C16.4003 7.27503 16.8003 7.27503 17.0419 7.5167C17.2836 7.75837 17.2836 8.15837 17.0419 8.40003L11.6086 13.8334C11.1669 14.275 10.5836 14.5 10.0003 14.5Z"
              fill="#2C2C2C"/>
          </svg>
          <svg *ngIf="sortingOpen" width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9.99998 5.99997C10.5833 5.99997 11.1667 6.22497 11.6083 6.66663L17.0417 12.1C17.2833 12.3416 17.2833 12.7416 17.0417 12.9833C16.8 13.225 16.4 13.225 16.1583 12.9833L10.725 7.54997C10.325 7.14997 9.67498 7.14997 9.27498 7.54997L3.84165 12.9833C3.59999 13.225 3.19998 13.225 2.95832 12.9833C2.71665 12.7416 2.71665 12.3416 2.95832 12.1L8.39165 6.66663C8.83332 6.22497 9.41665 5.99997 9.99998 5.99997Z" fill="#071739"/>
          </svg>
        </div>

        <div class="catalog-sorting-body" *ngIf="sortingOpen">
          <app-filter *ngFor="let category of categories" [category]="category" [activeCategories]="activeParams.categories"></app-filter>
        </div>
      </div>
    </div>

    <div class="catalog-layout">
      <div class="catalog-products">
        <app-article *ngFor="let article of articles?.items" [article]="article"></app-article>
      </div>
    </div>


    <div class="pagination" *ngIf="pages.length > 1" >
      <div class="pagination-arrow prev" [class.disabled]="activeParams.page ? activeParams.page === 1 : true" (click)="openPrevPage()">

        <svg viewBox="-19.04 0 75.804 75.804" xmlns="http://www.w3.org/2000/svg" transform="matrix(-1, 0, 0, 1, 0, 0)"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="Group_65" data-name="Group 65" transform="translate(-831.568 -384.448)"> <path id="Path_57" data-name="Path 57" d="M833.068,460.252a1.5,1.5,0,0,1-1.061-2.561l33.557-33.56a2.53,2.53,0,0,0,0-3.564l-33.557-33.558a1.5,1.5,0,0,1,2.122-2.121l33.556,33.558a5.53,5.53,0,0,1,0,7.807l-33.557,33.56A1.5,1.5,0,0,1,833.068,460.252Z"></path> </g> </g></svg>
      </div>
      <div class="pagination-pages">
        <a class="pagination-page"  *ngFor="let page of pages" (click)="openPage(page)" [class.active]="activeParams.page ? activeParams.page === page : (page === 1)">{{page}}</a>
      </div>
      <div class="pagination-arrow next" [class.disabled]="activeParams.page ? activeParams.page === pages.length : false" (click)="openNextPage()">

        <svg viewBox="-19.04 0 75.804 75.804" xmlns="http://www.w3.org/2000/svg" ><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <g id="Group_65" data-name="Group 65" transform="translate(-831.568 -384.448)"> <path id="Path_57" data-name="Path 57" d="M833.068,460.252a1.5,1.5,0,0,1-1.061-2.561l33.557-33.56a2.53,2.53,0,0,0,0-3.564l-33.557-33.558a1.5,1.5,0,0,1,2.122-2.121l33.556,33.558a5.53,5.53,0,0,1,0,7.807l-33.557,33.56A1.5,1.5,0,0,1,833.068,460.252Z"></path> </g> </g></svg>
      </div>
    </div>
  </div>
</div>
