<section class="signup" [formGroup]="signUpForm" >
  <div class="container">
    <div class="signup-left">
      <div class="auth-title">Войти в личный кабинет</div>
      <form class="auth-form">
        <input class="reg-input" type="text" placeholder="Ваше имя" formControlName="name"
               [ngStyle]="{'border-color':signUpForm.get('name')?.invalid
                 && (signUpForm.get('name')?.dirty || signUpForm.get('name')?.touched) ? 'red' : ''}">
        <input class="reg-input" type="text" placeholder="Электронная почта" formControlName="email"
               [ngStyle]="{'border-color':signUpForm.get('email')?.invalid
                 && (signUpForm.get('email')?.dirty || signUpForm.get('email')?.touched) ? 'red' : ''}">
        <input class="reg-input" type="password" placeholder="Пароль" formControlName="password"
               [ngStyle]="{'border-color':signUpForm.get('password')?.invalid
                 && (signUpForm.get('password')?.dirty || signUpForm.get('password')?.touched) ? 'red' : ''}">
        <input class="checkbox" id="checkbox" type="checkbox" formControlName="acceptPolitics">
        <label class="checkbox-label" for="checkbox">Я принимаю <a class="checkbox-link" [routerLink]="['/politic']" fragment="user-agreement">условия пользовательского соглашения</a> и даю <a class="checkbox-link" [routerLink]="['/politic']" fragment="data">согласие на обработку персональных данных.</a></label>
        <button class="button auth-button" [disabled]="signUpForm.invalid" (click)="signup()">Зарегистрироваться</button>
      </form>

      <div class="auth-info">
        <div class="auth-info-text">Уже есть аккаунт?</div>
        <a class="auth-info-link" routerLink="/login">Войдите</a>
      </div>
    </div>
    <div class="auth-bg-image signup-right"></div>
  </div>
</section>
